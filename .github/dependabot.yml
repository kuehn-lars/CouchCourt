version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for the routine churn, separate PRs for majors, which need reading.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # @types/node describes the runtime, and the runtime is `.nvmrc`'s Node 24
    # LTS. A newer major types APIs Node 24 does not have. Bump it with `.nvmrc`.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
