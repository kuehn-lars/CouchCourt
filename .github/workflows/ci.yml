name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run from the Actions tab on any branch, without opening a pull request.
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Every OS the host can run on. Nothing here is OS-specific on purpose —
    # `npm run certs` dropped `openssl` so Windows could host — and this is
    # what keeps it that way. fail-fast off: one OS failing should not hide
    # whether the others pass.
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `if: '!cancelled()'` on every step below: one job per OS keeps CI
      # simple, but without this a lint error would mask every test failure and
      # you would fix them one push at a time. This way one run reports
      # everything that is wrong.
      - name: Lint and format
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Knowledge vault integrity
        if: ${{ !cancelled() }}
        run: npm run vault:check
