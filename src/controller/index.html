<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			A tennis ball, inline as a data URI rather than a file in `public/`.
			Without any icon link at all the browser still asks for
			`/favicon.ico` and gets a 404 — the last console error on the
			shipping build, and a generic tab icon on the host screen someone
			is about to show a room. Inline keeps it to zero new files and no
			asset pipeline; `#` has to be written `%23` inside a data URI.
		-->
		<link
			rel="icon"
			href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="%23d8f24a"/><path d="M4.5 5.5a16 16 0 0 1 0 21M27.5 5.5a16 16 0 0 0 0 21" fill="none" stroke="%230a1a2e" stroke-width="2.2"/></svg>'
		/>
		<!--
			user-scalable=no and viewport-fit=cover matter here: a player is
			swinging the phone, and a stray pinch-zoom or a control under the
			home indicator ruins the round.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#0b1d13" />
		<title>SwingCourt Controller</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0b1d13;
				color: #e8f5ec;
				font: 16px/1.5 -apple-system, system-ui, sans-serif;
				/* A racket swing must never scroll or rubber-band the page. */
				overscroll-behavior: none;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
			}
			/* Default link blue is close to unreadable on this background. */
			a {
				color: #7fe0a4;
			}
			main {
				display: grid;
				place-content: center;
				height: 100%;
				padding: max(1rem, env(safe-area-inset-top)) 1rem
					max(1rem, env(safe-area-inset-bottom));
				text-align: center;
			}
			button {
				font: inherit;
				padding: 0.9rem 1.6rem;
				border: 0;
				border-radius: 0.6rem;
				background: #7fe0a4;
				color: #0b1d13;
				font-weight: 600;
			}
			.side {
				font-size: 2rem;
				font-weight: 700;
				margin: 0 0 0.25rem;
			}
			.hint {
				opacity: 0.7;
			}
		</style>
	</head>
	<body>
		<!--
			Racket controller. iOS Safari only.
			Requires a secure context AND a tap-triggered
			DeviceMotionEvent.requestPermission() — see the vault note
			llm-knowledge/platform/ios-motion-permission.md before touching this.
		-->
		<main>
			<section id="gate">
				<h1>SwingCourt</h1>
				<p>
					This phone is your racket. It needs access to motion sensors to
					feel your swing — nothing is recorded or sent anywhere but the
					screen you are playing on.
				</p>
				<button id="enable" type="button">Enable motion</button>
				<p id="gate-status" role="status"></p>
			</section>

			<section id="play" hidden>
				<p id="side" class="side"></p>
				<p id="status" role="status">Connecting…</p>
				<p id="hint" class="hint">Waiting for the host.</p>
			</section>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
