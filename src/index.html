<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			The bare LAN address is what someone types on the Mac, and what a
			mistyped QR scan lands on. Both belong on the host page. A meta
			refresh, not a server redirect, so dev and the built site behave
			identically with no middleware in either.
		-->
		<meta http-equiv="refresh" content="0; url=/host/" />
		<title>CouchCourt</title>
	</head>
	<body>
		<a href="/host/">CouchCourt</a>
	</body>
</html>
