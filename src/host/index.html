<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SwingCourt</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0a1a2e;
				color: #e8f5ec;
				font: 16px/1.5 system-ui, sans-serif;
				overflow: hidden;
			}
			#scene {
				display: block;
				width: 100%;
				height: 100%;
			}
			#ui {
				position: fixed;
				inset: 0;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<!-- Host display: runs the authoritative simulation and renders it
		     (`src/host/render/`). -->
		<canvas id="scene"></canvas>
		<div id="ui"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
